[project]
name = "cad-gen"
version = "0.1.0"
description = "Agentic text-to-CAD: generates CadQuery geometry from natural language via a self-refine loop with visual critique"
readme = "README.md"
authors = [
    { name = "Phi Linh", email = "philinh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.7.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.8.0",  # reproject_check: drawing line masks, distance transforms, overlays
    "pydantic-ai-slim[google,openai]>=1.107.0",  # openai extra also powers the BMW gateway
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "trimesh>=4.12.2",
    "typer>=0.26.7",
]

[project.scripts]
cad-gen = "cad_gen.cli:app"

[project.optional-dependencies]
web = [
    "fal-client>=0.8.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
