[project]
name = "cad-gen"
version = "0.1.0"
description = "Agentic text-to-CAD: generates CadQuery or build123d geometry from natural language via a self-refine loop with visual critique"
readme = "README.md"
authors = [
    { name = "Phi Linh", email = "philinh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.7.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.8.0",  # reproject_check: drawing line masks, distance transforms, overlays
    "pydantic-ai-slim[google,openai]>=1.107.0",  # openai extra also powers the BMW gateway
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "trimesh>=4.12.2",
    "typer>=0.26.7",
]

[project.scripts]
cad-gen = "cad_gen.cli:app"
cad-gen-bench = "cad_gen.bench.cli:app"

[project.optional-dependencies]
# Alternative geometry kernel, selected per run with `cad-gen --library build123d`.
# Pinned <0.10 deliberately: 0.9.x requires cadquery-ocp>=7.8,<7.9, which is exactly the
# 7.8.1.1 already locked for cadquery, so it installs without touching the CadQuery path.
# 0.10+ switches to cadquery-ocp-novtk>=7.9, which would force cadquery 2.7 -> 2.8 and move
# OCCT 7.8 -> 7.9 underneath reproject/check.py's raw OCP imports. Do not relax this bound
# without re-locking and re-running the CadQuery end-to-end checks.
build123d = [
    "build123d>=0.9,<0.10",
    # Transitive pin, not a direct import. build123d 0.9.1 declares an open `py-lib3mf>=2.3.1`,
    # which was correct when it shipped: 2.3.1 is a universal py3-none-any wheel. From 2.4.1 on,
    # py-lib3mf publishes manylinux aarch64 wheels ONLY, so the open range now resolves to a
    # distribution that cannot install on macOS or x86 Linux. Upstream fixed this in build123d
    # 0.11 by splitting the requirement on a platform marker; we backport the same marker and
    # hold the universal wheel everywhere except the one platform 2.4.1+ actually targets.
    "py-lib3mf==2.3.1; sys_platform != 'linux' or platform_machine != 'aarch64'",
]
bench = [
    "huggingface-hub>=0.28",  # snapshot_download the CADGenBench inputs dataset
    "pyyaml>=6.0",  # parse each sample's description.yaml
]
web = [
    "fal-client>=0.8.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
